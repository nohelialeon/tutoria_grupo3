<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutorías y Asesorías – Grupo 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 
  <header class="header">
    <div class="header-inner">
      <div class="logo-block">
        <span class="logo-icon"></span>
        <div>
          <h1 class="site-title">Tutorías &amp; Asesorías</h1>
          <p class="site-sub">Grupo 3 · Universidad Técnica de Manabí</p>
        </div>
      </div>
    </div>
  </header>
 
  <main class="main contenedor">
 
    <!-- Filtros -->
    <section class="filtros card-container">
      <h2>Buscar Asesorías</h2>
      <div class="filtros-controles">
        <input type="text" id="input-busqueda" class="search-input" placeholder=" Buscar por docente...">
        <select id="select-materia" class="filter-select">
          <option value="Todas">Todas las materias</option>
          <option value="Programación Web">Programación Web</option>
          <option value="Matemáticas Discretas">Matemáticas Discretas</option>
          <option value="Bases de Datos">Bases de Datos</option>
          <option value="Física">Física</option>
          <option value="Ingeniería de Software">Ingeniería de Software</option>
          <option value="Redes">Redes</option>
        </select>
      </div>
    </section>
 
    <div class="layout-principal">
 
      <!-- Listado -->
      <section class="listado">
        <h2>Asesorías Disponibles</h2>
        <div id="contenedor-tarjetas" class="grid-tarjetas"></div>
      </section>
 
      <!-- Formulario -->
      <aside class="formulario-seccion card-container">
        <h2 id="titulo-formulario">Solicitar Nueva Asesoría</h2>
 
        <div id="mensaje-error" class="oculto"></div>
 
        <form id="form-solicitud">
          <input type="hidden" id="tutoria-id">
 
          <div class="form-group">
            <label for="docente">Docente</label>
            <input type="text" id="docente" class="form-input" placeholder="Ej. Juan Pérez">
          </div>
 
          <div class="form-group">
            <label for="materia">Materia</label>
            <select id="materia" class="form-input">
              <option value="" disabled selected>Selecciona una materia...</option>
              <option value="Programación Web">Programación Web</option>
              <option value="Matemáticas Discretas">Matemáticas Discretas</option>
              <option value="Bases de Datos">Bases de Datos</option>
              <option value="Física">Física</option>
              <option value="Ingeniería de Software">Ingeniería de Software</option>
              <option value="Redes">Redes</option>
            </select>
          </div>
 
          <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" class="form-input">
          </div>
 
          <button type="submit" id="btn-submit" class="btn btn-primary">Registrar Solicitud</button>
          <button type="button" id="btn-cancelar" class="btn btn-danger oculto">Cancelar Edición</button>
        </form>
      </aside>
 
    </div>
  </main>
 
  <!-- Modal Detalle -->
  <div id="modal-detalle" class="modal-overlay oculto">
    <div class="modal-box">
      <span id="cerrar-modal" class="modal-close">✕</span>
      <h2 id="modal-materia" class="modal-title"></h2>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-section">
            <p class="detail-label">Docente</p>
            <p class="detail-value" id="modal-docente"></p>
          </div>
          <div class="detail-section">
            <p class="detail-label">Fecha</p>
            <p class="detail-value" id="modal-fecha"></p>
          </div>
          <div class="detail-section">
            <p class="detail-label">Estado</p>
            <p class="detail-value" id="modal-estado"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <div id="toast" class="oculto"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
